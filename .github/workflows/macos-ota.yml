# Build NailQue-macOS.pkg and publish a GitHub Release on every push to
# release/macos, so in-app OTA can pick up new Mac builds.
#
# Version embedded in the app: 1.0.<github.run_number> (monotonic vs repo VERSION file).
# Tag: v1.0.<github.run_number>
# Keep this workflow filename so github.run_number stays continuous for installed clients.

name: macOS OTA release

on:
  push:
    branches:
      - release/macos
  workflow_dispatch:

concurrency:
  group: macos-ota-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Version, build installer
        run: |
          set -euo pipefail
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          echo "$VERSION" > platforms/macos/VERSION
          echo "Building version $VERSION"
          bash platforms/macos/build.sh
          test -f "dist-installers/NailQue-macOS-${VERSION}.pkg"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: NailQue v1.0.${{ github.run_number }}
          files: dist-installers/NailQue-macOS-1.0.${{ github.run_number }}.pkg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
