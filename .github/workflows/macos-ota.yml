# Build NailQue-macOS.pkg and publish a GitHub Release when a version tag is pushed.
# In-app OTA reads GitHub Releases; tagged builds keep VERSION stable instead of
# minting 1.0.<run_number> on every commit to main.

name: macOS OTA release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: macos-ota-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Version, build installer
        working-directory: luxe-nails
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(tr -d '[:space:]' < VERSION)"
          fi
          echo "$VERSION" > VERSION
          echo "Building version $VERSION"
          bash build-mac.sh
          test -f dist-installers/NailQue-macOS.pkg
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: NailQue v${{ env.VERSION }}
          files: luxe-nails/dist-installers/NailQue-macOS.pkg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
