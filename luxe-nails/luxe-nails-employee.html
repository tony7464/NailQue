<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>M. VINCÉ Nail Spa • Employee Portal</title>
    <link rel="stylesheet" href="/static/css/employee.css">

</head>
<body>
    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="main">
        <div class="header">M. VINCÉ</div>
        <div style="text-align:center; margin-bottom:32px;">
            <h1 style="font-size:32px; color:#d4af77;">Employee Portal</h1>
        </div>
        
        <input type="text" id="loginIdentifier" class="big-input" placeholder="Login ID" autofocus>
        <input type="password" id="loginPassword" class="big-input" placeholder="Password">
        <div class="helper-row">
            <label>
                <input id="showLoginPassword" type="checkbox" style="margin-right:6px;vertical-align:middle;">
                Show password
            </label>
            <span>Press Enter to log in</span>
        </div>
        
        <button onclick="performEmployeeLogin()" class="login-button">LOG IN</button>
        <button onclick="window.location.href='/'" class="nav-back-btn">BACK TO QUEUE</button>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboardScreen" class="main" style="display:none;">
        <div class="header">M. VINCÉ</div>
        
        <div class="welcome">Welcome back,</div>
        <div class="tech-name" id="dashName"></div>
        
        <div class="stat-card">
            <div style="font-size:18px; color:#d4af77;">THIS WEEK</div>
            <div id="weekTotal" class="total-number">0</div>
            <div style="color:#d4af77; font-size:22px;">Customers Served</div>
        </div>
        
        <div class="stat-card">
            <div style="font-size:18px; color:#d4af77;">ESTIMATED EARNINGS</div>
            <div id="weekEarnings" class="total-number">$0.00</div>
            <div style="color:#d4af77; font-size:22px;">(60% of services)</div>
        </div>
        
        <div class="stat-card">
            <div style="font-size:22px; color:#d4af77; margin-bottom:16px;">DAILY BREAKDOWN</div>
            <div id="dailyList" class="daily-list"></div>
        </div>
        
        <button onclick="logoutEmployee()" class="logout-btn">LOG OUT</button>
        <button onclick="window.location.href='/'" class="nav-back-btn">BACK TO QUEUE</button>
    </div>

    <div id="employeeToast" class="toast" role="status" aria-live="polite"></div>

    <script src="/static/js/http.js"></script>
    <script src="/static/js/employee.js"></script>

</body>
</html>
