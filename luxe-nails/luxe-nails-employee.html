<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>M. VINCÉ Nail Spa • Employee Portal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@400;500;600&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: #0f0c0a;
            color: #f5f0e8;
            cursor: url("/assets/cursors/windows11-black.cur"), auto;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: linear-gradient(90deg, #1a1208, #3d2a1f);
            color: #d4af77;
            text-align: center;
            padding: 20px;
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 3px;
            border-radius: 20px;
            margin-bottom: 20px;
        }
        
        .main {
            flex: 1;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            border: 1px solid rgba(212, 175, 119, 0.1);
            display: flex;
            flex-direction: column;
        }
        
        .welcome {
            font-size: 28px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 8px;
            color: #d4af77;
        }
        
        .tech-name {
            font-size: 42px;
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            text-align: center;
            color: #f5f0e8;
            margin-bottom: 32px;
        }
        
        .stat-card {
            background: rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 32px;
            margin-bottom: 24px;
            text-align: center;
        }
        
        .total-number {
            font-size: 72px;
            font-weight: 700;
            color: #d4af77;
            line-height: 1;
        }
        
        .daily-list {
            margin-top: 12px;
        }
        
        .day-row {
            display: flex;
            justify-content: space-between;
            padding: 16px 20px;
            background: rgba(255,255,255,0.06);
            border-radius: 16px;
            margin-bottom: 12px;
            font-size: 20px;
        }
        
        .logout-btn {
            margin-top: auto;
            background: #c48b6f;
            color: #1a1208;
            font-size: 22px;
            font-weight: 700;
            padding: 20px;
            border: none;
            border-radius: 9999px;
            cursor: pointer;
            width: 100%;
        }
        
        .big-input {
            width: 100%;
            padding: 24px;
            font-size: 28px;
            font-weight: 600;
            border: none;
            border-radius: 20px;
            background: #1f1914;
            color: #f5f0e8;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .login-button {
            background: linear-gradient(90deg, #d4af77, #c48b6f);
            color: #1a1208;
            font-size: 28px;
            font-weight: 700;
            padding: 24px;
            border: none;
            border-radius: 9999px;
            cursor: pointer;
        }
        .nav-back-btn {
            margin-top: 12px;
            background: transparent;
            color: #d4af77;
            font-size: 18px;
            font-weight: 600;
            padding: 14px;
            border: 2px solid #d4af77;
            border-radius: 9999px;
            cursor: pointer;
            width: 100%;
        }

        .helper-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #a58f6b;
            font-size: 14px;
            margin-top: -10px;
            margin-bottom: 16px;
        }

        .toast {
            position: fixed;
            right: 20px;
            bottom: 20px;
            min-width: 240px;
            background: #2a221b;
            border: 1px solid #d4af77;
            color: #f5f0e8;
            padding: 10px 12px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            display: none;
            z-index: 9999;
        }

        .toast.error {
            border-color: #ff9b9b;
            color: #ffd9d9;
        }
    </style>
</head>
<body>
    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="main">
        <div class="header">M. VINCÉ</div>
        <div style="text-align:center; margin-bottom:32px;">
            <h1 style="font-size:32px; color:#d4af77;">Employee Portal</h1>
        </div>
        
        <input type="text" id="loginIdentifier" class="big-input" placeholder="Login ID" autofocus>
        <input type="password" id="loginPassword" class="big-input" placeholder="Password">
        <div class="helper-row">
            <label>
                <input id="showLoginPassword" type="checkbox" style="margin-right:6px;vertical-align:middle;">
                Show password
            </label>
            <span>Press Enter to log in</span>
        </div>
        
        <button onclick="performEmployeeLogin()" class="login-button">LOG IN</button>
        <button onclick="window.location.href='/'" class="nav-back-btn">BACK TO QUEUE</button>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboardScreen" class="main" style="display:none;">
        <div class="header">M. VINCÉ</div>
        
        <div class="welcome">Welcome back,</div>
        <div class="tech-name" id="dashName"></div>
        
        <div class="stat-card">
            <div style="font-size:18px; color:#d4af77;">THIS WEEK</div>
            <div id="weekTotal" class="total-number">0</div>
            <div style="color:#d4af77; font-size:22px;">Customers Served</div>
        </div>
        
        <div class="stat-card">
            <div style="font-size:18px; color:#d4af77;">ESTIMATED EARNINGS</div>
            <div id="weekEarnings" class="total-number">$0.00</div>
            <div style="color:#d4af77; font-size:22px;">(60% of services)</div>
        </div>
        
        <div class="stat-card">
            <div style="font-size:22px; color:#d4af77; margin-bottom:16px;">DAILY BREAKDOWN</div>
            <div id="dailyList" class="daily-list"></div>
        </div>
        
        <button onclick="logoutEmployee()" class="logout-btn">LOG OUT</button>
        <button onclick="window.location.href='/'" class="nav-back-btn">BACK TO QUEUE</button>
    </div>

    <div id="employeeToast" class="toast" role="status" aria-live="polite"></div>

    <script>
        // ============== FULL M. VINCÉ SERVICE MENU ==============
        const servicesMenu = [
            {name: "Spa Manicure", price: 40},
            {name: "Signature Manicure", price: 50},
            {name: "Ultimate M.V. Spa Manicure", price: 65},
            {name: "Spa Pedicure", price: 60},
            {name: "Signature Pedicure", price: 70},
            {name: "Full Set Acrylic", price: 55},
            {name: "Fill", price: 40},
            {name: "Gel Polish", price: 25},
            {name: "Polish Change", price: 15},
            {name: "Nail Art (per nail)", price: 5},
            // Shape surcharges
            {name: "Coffin / Stiletto Shape (+$5)", price: 5},
            {name: "Almond / Ballerina Shape (+$5)", price: 5},
            // Add-ons
            {name: "Paraffin Treatment", price: 15},
            {name: "Sugar Scrub", price: 10},
            {name: "Collagen Gloves", price: 20},
            {name: "Hot Stone Massage", price: 15}
        ];

        let currentTech = null;
        let techCredentials = {};
        let serviceHistoryRecords = [];
        let toastTimer = null;
        const soundFx = {
            startup: "/assets/sounds/startup_fx.mp3",
            click: "/assets/sounds/click_fx.mp3",
        };

        async function loadSharedData() {
            try {
                const response = await fetch("/api/shared/state");
                const data = await response.json();
                if (!response.ok || !data.ok || !data.state || typeof data.state.credentials !== "object") {
                    throw new Error("Shared state unavailable");
                }
                techCredentials = data.state.credentials || {};
                localStorage.setItem("nailTechCredentials", JSON.stringify(techCredentials));
            } catch (error) {
                techCredentials = JSON.parse(localStorage.getItem("nailTechCredentials") || "{}");
            }
        }

        async function performEmployeeLogin() {
            const id = document.getElementById("loginIdentifier").value.trim().toLowerCase();
            const pass = document.getElementById("loginPassword").value;
            if (!id || !pass) {
                showToast("Please enter both fields.", true);
                return;
            }

            // Refresh credentials from the local server first, then fall back.
            await loadSharedData();
            for (let name in techCredentials) {
                const t = techCredentials[name];
                if (t.identifier && t.identifier.toLowerCase() === id && t.password === pass) {
                    if (t.mustChangePassword) {
                        const changed = await promptEmployeePasswordChange(id, pass, name);
                        if (!changed) return;
                    }
                    currentTech = name;
                    localStorage.setItem("employeeLastLoginId", id);
                    await showDashboard();
                    showToast(`Welcome, ${name}.`, false);
                    return;
                }
            }
            showToast("Invalid credentials.", true);
        }

        async function promptEmployeePasswordChange(identifier, currentPassword, techName) {
            const nextPassword = prompt(
                `${techName}, please set a new password before continuing.\nUse at least 4 characters.`,
                ""
            );
            if (nextPassword == null) {
                showToast("Password update required before login.", true);
                return false;
            }
            const newPassword = String(nextPassword).trim();
            if (newPassword.length < 4) {
                showToast("New password must be at least 4 characters.", true);
                return false;
            }
            if (newPassword === currentPassword) {
                showToast("New password must be different.", true);
                return false;
            }
            try {
                const response = await fetch("/api/tech/change-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ identifier, currentPassword, newPassword })
                });
                const data = await response.json();
                if (!response.ok || !data.ok) {
                    throw new Error(data.error || "Could not update password.");
                }
                await loadSharedData();
                document.getElementById("loginPassword").value = newPassword;
                showToast("Password updated. Login complete.", false);
                return true;
            } catch (error) {
                showToast(error.message || "Password update failed.", true);
                return false;
            }
        }

        async function showDashboard() {
            document.getElementById("loginScreen").style.display = "none";
            document.getElementById("dashboardScreen").style.display = "flex";
            document.getElementById("dashName").textContent = currentTech;
            await loadServiceHistory();
            renderWeeklyStats();
        }

        function logoutEmployee() {
            currentTech = null;
            document.getElementById("dashboardScreen").style.display = "none";
            document.getElementById("loginScreen").style.display = "flex";
            document.getElementById("loginPassword").value = "";
            document.getElementById("loginIdentifier").focus();
            showToast("Logged out.", false);
        }

        function renderWeeklyStats() {
            if (!currentTech) return;

            const records = getEmployeeWeekRecords(currentTech);
            const totalCustomers = records.length;
            const totalEarnings = records.reduce((sum, r) => sum + (r.employeeShare || 0), 0);

            document.getElementById("weekTotal").textContent = String(totalCustomers);
            document.getElementById("weekEarnings").textContent = `$${totalEarnings.toFixed(2)}`;
            renderDailyBreakdown(records);
        }

        function getEmployeeWeekRecords(techName) {
            const now = new Date();
            const start = new Date(now);
            start.setHours(0, 0, 0, 0);
            start.setDate(start.getDate() - 6);

            return serviceHistoryRecords.filter((record) => {
                if (!record || record.tech !== techName || !record.completedAt) return false;
                const completed = new Date(record.completedAt);
                return completed >= start && completed <= now;
            });
        }

        async function loadServiceHistory() {
            try {
                const response = await fetch("/api/services/history");
                const data = await response.json();
                if (!response.ok || !data.ok || !Array.isArray(data.records)) {
                    throw new Error("History unavailable");
                }
                serviceHistoryRecords = data.records;
            } catch (error) {
                serviceHistoryRecords = JSON.parse(localStorage.getItem("mvServiceRecords") || "[]");
            }
        }

        function renderDailyBreakdown(records) {
            const dailyList = document.getElementById("dailyList");
            if (records.length === 0) {
                dailyList.innerHTML = `<div style="text-align:center; color:#a58f6b; padding:8px 0;">No completed services this week yet.</div>`;
                return;
            }

            const byDay = {};
            records.forEach((record) => {
                const key = new Date(record.completedAt).toLocaleDateString("en-US", { weekday: "short" });
                if (!byDay[key]) byDay[key] = { customers: 0, earnings: 0 };
                byDay[key].customers += 1;
                byDay[key].earnings += record.employeeShare || 0;
            });

            const orderedWeekdays = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
            dailyList.innerHTML = orderedWeekdays
                .filter((day) => byDay[day])
                .map((day) => `
                    <div class="day-row">
                        <span class="day-name">${day} (${byDay[day].customers})</span>
                        <span>$${byDay[day].earnings.toFixed(2)}</span>
                    </div>
                `)
                .join("");
        }

        // Utility available for employee-side calculations based on selected menu items
        function calculateMenuTotalByIndexes(indexes) {
            return (indexes || []).reduce((sum, idx) => {
                const item = servicesMenu[idx];
                return sum + (item ? item.price : 0);
            }, 0);
        }

        async function init() {
            await loadSharedData();
            await loadServiceHistory();
            const savedLoginId = localStorage.getItem("employeeLastLoginId");
            if (savedLoginId) {
                document.getElementById("loginIdentifier").value = savedLoginId;
            }
            document.getElementById("showLoginPassword").addEventListener("change", (event) => {
                document.getElementById("loginPassword").type = event.target.checked ? "text" : "password";
            });
            document.getElementById("loginIdentifier").addEventListener("keydown", (event) => {
                if (event.key === "Enter") performEmployeeLogin();
            });
            document.getElementById("loginPassword").addEventListener("keydown", (event) => {
                if (event.key === "Enter") performEmployeeLogin();
            });
            setupSoundEffects();
            setTimeout(() => playSoundEffect("startup"), 220);
        }

        function showToast(message, isError) {
            const toast = document.getElementById("employeeToast");
            toast.textContent = message;
            toast.classList.toggle("error", !!isError);
            toast.style.display = "block";
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.style.display = "none";
            }, 2500);
        }

        function playSoundEffect(kind) {
            const src = soundFx[kind];
            if (!src) return;
            const audio = new Audio(src);
            audio.preload = "auto";
            audio.volume = 0.6;
            audio.play().catch(() => {});
        }

        function setupSoundEffects() {
            document.addEventListener("click", (event) => {
                const clickable = event.target.closest("button, [role='button'], .login-button, .logout-btn, .nav-back-btn");
                if (!clickable) return;
                playSoundEffect("click");
            }, true);
        }
        
        window.onload = init;
    </script>
</body>
</html>
